services:
  - type: web
    name: dawaaidost
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: TINKER_API_KEY
        sync: false
      - key: BACKBOARD_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
